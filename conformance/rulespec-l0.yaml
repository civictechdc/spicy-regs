notes: |
  Parquet is a non-JSON-LD carrier. The Rulespec contract is pinned by content
  digest; every mapped subject, range, direction, value kind, transform, and
  example is documented in docs/ontology.md. The paired before/after corpus
  exercise is recorded in docs/rulespec-repair-report.md at the evidence digest
  above. Unversioned CFR and authority rollups are not claimed as immutable
  Artifact relationships. Cross-posting links project only when the raw
  regulations.gov value has exact membership in the Federal Register source
  snapshot. Null proceeding stages remain absent; non-null stages agree with
  the latest stage-family event. Agency codes never mint Authority placeholders.
  Comment periods retain Proceeding or source-backed Docket anchors and map
  their opening Artifacts separately from prov:wasDerivedFrom evidence.
  Retrieval-grade tags and assignments remain outside the L0 claim until a
  human-reviewed promotion creates a distinct Rulespec concept node and
  alignment link. The digest is an unreleased candidate pin; the module remains
  Experimental pending release and non-originating-consumer review.

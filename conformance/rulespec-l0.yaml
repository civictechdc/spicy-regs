notes: |
  Parquet is a non-JSON-LD carrier. The Rulespec contract is pinned by content
  digest; every mapped subject, range, direction, value kind, transform, and
  example is documented in docs/ontology.md. The machine-readable corpus
  receipt is pinned above; docs/rin-ontology-revision-report.md explains it and
  records the comparison to the prior candidate. The release fields above
  intentionally remain null, so production
  publication fails closed while this contract is an unreleased candidate.
  Unversioned CFR and authority rollups are not claimed as immutable
  Artifact relationships. Cross-posting links project only when the raw
  regulations.gov value has exact membership in the Federal Register source
  snapshot. Null proceeding stages remain absent; non-null stages agree with
  the latest action-specific stage-family event. A RIN identifies a durable
  Regulatory Agenda item, never a Proceeding. Agenda observations use the
  general foaf:primaryTopic document-to-subject seam; provenance-bearing action
  associations use the DCAT qualified-relation pattern. Unified Agenda stage,
  priority, authority, and CFR context never fan out to Proceedings through RIN
  equality. Agency codes never mint Authority placeholders.
  Comment periods retain Proceeding or source-backed Docket anchors and map
  their opening Artifacts separately from prov:wasDerivedFrom evidence.
  Retrieval-grade tags and assignments remain outside the L0 claim until a
  human-reviewed promotion creates a distinct Rulespec concept node and
  alignment link. The digest is an unreleased candidate pin; the module remains
  Experimental pending release and non-originating-consumer review.

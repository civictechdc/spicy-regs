name: Check published table freshness

# Watches the base tables the daily ETL publishes (dockets, documents) alongside
# the external-source rollups. The base tables were added after a swallowed R2
# upload failure froze `dockets` at 2026-07-02 for ~8 weeks with the ETL still
# reporting success — comments had check-comments-freshness.yml, the rollups had
# this check, and the two largest base tables had nothing watching them at all.
#
# It also watches comment coverage: per-agency row counts from
# comments_index.parquet against the last known-good counts in the cached state
# file. check-comments-freshness only compares agencies present on both sides, so
# it stayed green through #197 while 76 agencies were missing from both. After a
# deliberate removal, dispatch once with accept_comment_coverage to rebaseline.

on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      accept_comment_coverage:
        description: 'Rebaseline comment coverage to current counts (after a deliberate removal)'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Restore row-count history
        uses: actions/cache/restore@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}
          restore-keys: rollup-freshness-

      - name: Check published tables
        env:
          ACCEPT_COVERAGE: ${{ inputs.accept_comment_coverage }}
        run: |
          ARGS=()
          if [ "$ACCEPT_COVERAGE" = "true" ]; then ARGS+=(--accept-comment-coverage); fi
          uv run python scripts/check_rollup_freshness.py "${ARGS[@]}"

      # Runs even when the freshness check failed: a dead purge credential and a
      # stale table are independent faults, and hiding one behind the other is
      # how the purge token went twelve days unnoticed in the first place.
      - name: Check Cloudflare purge credential
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run python scripts/check_purge_credential.py

      - name: Save row-count history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}

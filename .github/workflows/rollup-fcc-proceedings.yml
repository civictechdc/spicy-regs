name: Rollup — fcc_proceedings
on:
  schedule:
    # 18:10 UTC — incremental merge of new FCC ECFS proceedings.
    - cron: '10 18 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      fcc_since:
        description: 'Optional backfill start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fcc-proceedings
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      fcc_since: ${{ github.event_name == 'workflow_dispatch' && inputs.fcc_since || '' }}

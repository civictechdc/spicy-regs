name: Rollup — court_dockets
on:
  schedule:
    # 18:30 UTC — ingest CourtListener APA / agency-review dockets daily.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-courtlistener
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
